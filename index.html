<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>斗罗大陆 · 寒蝉雨传</title>
<style>
:root{
  --bg:#0a0e1a; --panel:#111827; --panel2:#1a2233; --border:#26344a;
  --text:#dbe7f5; --dim:#8fa6c4; --accent:#7dd3fc; --accent2:#38bdf8;
  --user:#1e3a5f; --ai:#141c2b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 800px at 20% -10%,#16233c 0%,var(--bg) 60%);
  color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.75; overflow:hidden;
}
.app{display:flex;flex-direction:column;height:100vh;max-width:980px;margin:0 auto;padding:12px;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  background:linear-gradient(180deg,#16233c,#111827);border:1px solid var(--border);border-radius:14px;flex-wrap:wrap}
.title{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.5px;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s;
  font-family:inherit;
}
button:hover{background:#22304a;border-color:#3a5273}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#2b6cb0,#1e4e8c);border-color:#3b82f6;color:#fff}
button.primary:hover{background:linear-gradient(180deg,#3b82f6,#2563eb)}
main{flex:1;overflow-y:auto;padding:6px 4px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:8px}
main::-webkit-scrollbar-thumb{background:#26344a;border-radius:4px}
.msg{display:flex;flex-direction:column;margin:14px 0;animation:fade .25s ease;align-items:flex-start}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.bubble{max-width:86%;padding:13px 17px;border-radius:14px;white-space:pre-wrap;
  word-break:break-word;border:1px solid var(--border)}
.msg.user .bubble{background:var(--user);border-color:#2c5282;border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--ai);border-bottom-left-radius:4px}
.msg.sys .bubble{background:#1c1a12;border-color:#4a3f1a;color:#e0c98a;font-size:13px;
  max-width:100%;text-align:center;margin:0 auto;align-self:center}
footer{display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12px;padding:5px 10px;background:#111a2b}
.inputbar{display:flex;gap:8px;align-items:flex-end}
textarea{
  flex:1;min-height:56px;max-height:180px;resize:vertical;background:var(--panel);
  color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
  font-family:inherit;font-size:15px;line-height:1.6;outline:none;
}
textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
dialog{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:16px;padding:22px;max-width:520px;width:92vw;
}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 16px;font-size:17px;color:var(--accent)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.field input,.field select{
  width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:9px;padding:9px 11px;font-family:inherit;font-size:14px;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--accent2)}
.hint{font-size:12px;color:var(--dim);line-height:1.6;margin-top:5px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.typing{display:inline-block;color:var(--accent);font-size:13px}
.typing::after{content:"…";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}

.optbar{
  display:flex;flex-direction:column;gap:6px;margin-top:10px;
  max-width:86%;width:100%;
}
.optbtn{
  text-align:left;padding:10px 15px;font-size:13.5px;
  background:#0f1a2b;border:1px solid var(--border);border-radius:10px;
  cursor:pointer;line-height:1.65;white-space:normal;word-break:break-word;
  color:var(--text);font-family:inherit;transition:.15s;
}
.optbtn:hover:not(:disabled){
  background:#16273f;border-color:var(--accent2);color:var(--accent);
}
.optbtn:disabled{opacity:.42;cursor:not-allowed}
.optbtn .num{
  display:inline-block;min-width:18px;margin-right:6px;
  color:var(--accent2);font-weight:600;
}

@media(max-width:600px){
  .app{padding:8px}
  .title{font-size:13px}
  .actions button{padding:6px 9px;font-size:12px}
}

dialog.roster{
  max-width:900px;width:96vw;max-height:90vh;padding:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.roster-head{
  padding:14px 22px 10px;border-bottom:1px solid var(--border);
}
.roster-head-row1{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.roster-head h2{margin:0;font-size:17px;color:var(--accent)}
.roster-tabs{display:flex;gap:6px;margin-top:10px}
.roster-tabs button{font-size:12px;padding:5px 11px;background:#0d1523}
.roster-tabs button.active{background:linear-gradient(180deg,#2b6cb0,#1e4e8c);
  border-color:#3b82f6;color:#fff}
.roster-sub{
  font-size:11.5px;color:var(--dim);margin-top:8px;
  padding:6px 10px;background:#0d1523;border-radius:8px;
  border:1px solid var(--border);
}
.roster-sub b{color:var(--accent);font-weight:600}
.roster-body{
  flex:1;overflow-y:auto;padding:16px 22px 22px;
}
.roster-body::-webkit-scrollbar{width:8px}
.roster-body::-webkit-scrollbar-thumb{background:#26344a;border-radius:4px}
.roster-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;
}
.dcard{
  background:linear-gradient(180deg,#141d2e,#0f1727);
  border:1px solid var(--border);border-radius:12px;padding:13px 15px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;
}
.dcard:hover{border-color:var(--accent2);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(56,189,248,.12)}
.dcard .name{font-size:15px;font-weight:600;color:#e8f3ff;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.dcard .wuhun{font-size:12px;color:var(--dim);margin-top:3px}
.dcard .heart{
  font-size:11px;padding:2px 7px;border-radius:20px;
  background:rgba(56,189,248,.12);color:var(--accent);border:1px solid rgba(56,189,248,.3);
}
.dcard .heart.established{
  background:rgba(255,120,180,.12);color:#ff9ec0;border-color:rgba(255,120,180,.35);
}
.dcard .age-row{
  margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim);
}
.dcard .age-tag{
  padding:2px 7px;background:#0d1523;border-radius:6px;border:1px solid var(--border);
}
.dcard .age-tag.frozen{
  background:rgba(167,139,250,.12);color:#c4b5fd;border-color:rgba(167,139,250,.35);
}
.dcard .age-tag.changing{
  background:rgba(56,189,248,.12);color:var(--accent);border-color:rgba(56,189,248,.3);
}
.dcard .age-tag.levelup{
  background:rgba(74,222,128,.12);color:#86efac;border-color:rgba(74,222,128,.35);
}
.dcard .bar{
  margin-top:9px;height:5px;border-radius:3px;background:#1b2537;overflow:hidden;
}
.dcard .bar-fill{
  height:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa);
  transition:width .3s;
}
.dcard .meta{
  margin-top:6px;display:flex;justify-content:space-between;
  font-size:11px;color:var(--dim);
}

.ddetail{display:none}
.ddetail.on{display:block}
.ddetail .back{
  font-size:12px;padding:5px 10px;background:#111a2b;margin-bottom:14px;
}
.ddetail .dname{
  font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px;
}
.ddetail .dsub{
  font-size:13px;color:var(--dim);margin-bottom:14px;
}
.detail-block{
  background:#0e1626;border:1px solid var(--border);border-radius:10px;
  padding:12px 15px;margin-bottom:11px;
}
.detail-block .k{
  font-size:12px;color:var(--accent2);margin-bottom:5px;font-weight:600;
  letter-spacing:.5px;
}
.detail-block .v{font-size:13.5px;color:var(--text);line-height:1.75}
.detail-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;
  margin-bottom:11px;
}
.stat-cell{
  background:#0e1626;border:1px solid var(--border);border-radius:9px;
  padding:9px 12px;
}
.stat-cell .sk{font-size:11px;color:var(--dim);margin-bottom:2px}
.stat-cell .sv{font-size:14px;color:var(--text);font-weight:600}
.stat-cell .sv em{font-style:normal;font-size:11px;color:var(--accent);font-weight:400;margin-left:3px}
.stat-cell.frozen{
  background:linear-gradient(180deg,#161a35,#12142a);
  border-color:rgba(167,139,250,.35);
}
.stat-cell.frozen .sk{color:#c4b5fd}
.stat-cell.frozen .sv{color:#e0d9ff}
.stat-cell.frozen .sv em{color:#c4b5fd}
.stat-cell.changing{
  background:linear-gradient(180deg,#0e1a2b,#0b1424);
  border-color:rgba(56,189,248,.3);
}
.stat-cell.changing .sk{color:var(--accent)}
.stat-cell.changing .sv{color:#c7ecff}
.stat-cell.levelup{
  background:linear-gradient(180deg,#0f2418,#0a1a12);
  border-color:rgba(74,222,128,.35);
}
.stat-cell.levelup .sk{color:#86efac}
.stat-cell.levelup .sv{color:#bbf7d0}
.stat-cell.levelup .sv em{color:#86efac}

.tagline{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
  background:rgba(56,189,248,.12);color:var(--accent);
  border:1px solid rgba(56,189,248,.3);margin-right:5px;
}
.tagline.established{
  background:rgba(255,120,180,.12);color:#ff9ec0;border-color:rgba(255,120,180,.35);
}
.tagline.off{
  background:rgba(120,120,120,.12);color:#8fa6c4;border-color:rgba(120,120,120,.3);
}
.empty-tip{
  text-align:center;color:var(--dim);font-size:13px;padding:30px 0;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">❄️ 斗罗大陆 · 寒蝉雨传 <span id="auto-save-tip" style="font-size:11px;color:#5a7a9a;margin-left:8px;font-weight:normal"></span></div>
    <div class="actions">
      <button id="btn-roster">📖 徒弟面板</button>
      <button id="btn-save">存档</button>
      <button id="btn-load">读档</button>
      <button id="btn-export">导出</button>
      <button id="btn-undo">撤回</button>
      <button id="btn-regen">重说</button>
      <button id="btn-reset">重开</button>
      <button id="btn-stash">偷衣机制：开</button>
      <button id="btn-settings">⚙ 设置</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="quick">
      <button data-cmd="（开启修罗场）">开启修罗场</button>
      <button data-cmd="（关闭修罗场）">关闭修罗场</button>
      <button data-cmd="（查看好感度）">查看好感度</button>
      <button data-cmd="（查看后宫）">查看后宫</button>
      <button data-cmd="（查看徒弟名录）">查看徒弟名录</button>
    </div>
    <div class="inputbar">
      <textarea id="input" placeholder="输入你的行动，或点击上方选项按钮。Enter 发送，Shift+Enter 换行。"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button id="btn-send" class="primary" style="padding:11px 18px">发送</button>
        <button id="btn-stop" style="display:none">停止</button>
      </div>
    </div>
  </footer>
</div>

<dialog id="dlg">
  <h2>API 设置</h2>
  <div class="field">
    <label>接口地址（Base URL）</label>
    <input id="cfg-url" list="url-list" placeholder="https://api.deepseek.com/v1" />
    <datalist id="url-list">
      <option value="https://api.deepseek.com/v1">DeepSeek</option>
      <option value="https://api.openai.com/v1">OpenAI</option>
      <option value="https://api.moonshot.cn/v1">Moonshot 月之暗面</option>
      <option value="https://dashscope.aliyuncs.com/compatible-mode/v1">通义千问</option>
      <option value="https://open.bigmodel.cn/api/paas/v4">智谱 GLM</option>
      <option value="https://api.siliconflow.cn/v1">硅基流动</option>
      <option value="https://openrouter.ai/api/v1">OpenRouter</option>
    </datalist>
    <div class="hint">填到 /v1 或 /v4 为止，不要带 /chat/completions</div>
  </div>
  <div class="field">
    <label>API Key</label>
    <input id="cfg-key" type="password" placeholder="sk-..." />
    <div class="hint">仅保存在你本机浏览器中，不会上传到任何第三方</div>
  </div>
  <div class="field">
    <label>模型名</label>
    <input id="cfg-model" placeholder="deepseek-chat" />
    <div class="hint">如 deepseek-chat / gpt-4o / moonshot-v1-128k / glm-4-plus</div>
  </div>
  <div class="field">
    <label>历史记忆轮数</label>
    <input id="cfg-history" type="number" min="4" max="80" value="20" />
    <div class="hint">发给 AI 的最近对话条数，越大越连贯但越费 token</div>
  </div>
  <div class="dialog-actions">
    <button id="btn-cancel">取消</button>
    <button id="btn-ok" class="primary">保存并开始</button>
  </div>
</dialog>

<dialog id="roster-dlg" class="roster">
  <div class="roster-head">
    <div class="roster-head-row1">
      <h2>📖 徒弟面板</h2>
      <button id="roster-close">关闭</button>
    </div>
    <div class="roster-tabs">
      <button class="tab active" data-tab="all">全部徒弟</button>
      <button class="tab" data-tab="harem">后宫名单</button>
      <button class="tab" data-tab="unlocked">已确立</button>
    </div>
    <div class="roster-sub" id="roster-sub">
      <b>寒蝉雨</b> 实际18岁起 · 外貌定格18岁 · 徒弟魂力随年龄增长
    </div>
  </div>
  <div class="roster-body">
    <div id="roster-grid" class="roster-grid"></div>
    <div id="roster-detail" class="ddetail"></div>
  </div>
</dialog>

<script type="text/plain" id="system-prompt">
你是文字冒险游戏《斗罗大陆》的主持人，也就是GM。世界锚定斗罗大陆第一部。你负责扮演所有NPC、裁定行动结果、维护数值系统。玩家角色已固定，无需询问角色信息，但开场前必须先让玩家选择时间段。

═══════════════════════════
一、输出符号规范（最高优先级）
═══════════════════════════
你的所有输出必须使用纯文本与中文标点，严禁使用任何 Markdown 符号。

禁止使用的符号包括但不限于：
星号，井号，反引号，大于号作为引用，方括号用于强调，下划线强调，波浪线强调，竖线表格，短横线用于列表或分割。

正确做法：
强调用中文引号「」或【】。
列表用中文数字加顿号，如一、二、三。
分隔用空行或中文横线。
状态栏用「字段名：内容」的形式，每项一行或用全角竖线 ｜ 分隔。
不要输出任何 HTML 标签。

例外：状态栏中允许使用全角竖线、emoji、以及冒号、顿号、句号、括号等中文标点。

═══════════════════════════
二、玩家角色卡（已固定，不得更改）
═══════════════════════════
姓名：寒蝉雨
性别：女
性取向：同性恋。她只对女性动心。对男性，无论何种意义上的喜欢都绝无可能。不是厌恶，而是天然的无感与疏离，如同看见路边的石头。这一点贯穿始终，任何男性NPC都不可能进入她的感情线。
出身：霜月
武魂：第一武魂「月」，第二武魂「霜冰」，双生武魂，先天魂力20级，神赐
当前魂力：99级，封号斗罗级
魂环配置：由你根据剧情合理设定。建议月武魂与霜冰武魂各配高年限魂环，可含十万年。
身份：霜月月下庭出身。她的双生武魂本质是月神与冰神的神性残留，她并非普通魂师，而是两位外神在斗罗世界的代言人。
外貌：永远定格在18岁最美的瞬间。银白长发如月华倾泻，瞳色淡蓝近银，肌肤透澈如冰晶，气质清冷出尘。因霜月体质，永远不显老。

【时间与年龄】
寒蝉雨离开霜月时，18岁。这是整个故事的时间起点。
此后实际年龄随剧情推进增长，外貌永远定格18岁，不随实际年龄改变。
状态栏「时间」一栏须同时写明故事内日期与寒蝉雨真实年龄。

═══════════════════════════
三、霜月设定
═══════════════════════════
位置：斗罗大陆极北雪原深处，冰封山脉之后的悬空浮岛群。悬于云层之上，终年极光与月光笼罩。入口仅在每月满月夜显现于特定冰镜倒影中。

地貌：中央月陨湖，霜月森林，北端黄泉冰原，边缘悬冰崖。
气候：终年飘雪，雪未落地即融。一年三百天可见月，白昼如黄昏。
居民：全为女性，不足三千人，信奉月母。不与大陆建交。
外貌永恒：衰老但不显老。灵魂会疲惫苍老，皮囊永远定格在生命中最美的瞬间。死亡称「褪月」，遗体化为冰晶。
情感与子嗣：只与同性相爱，伴侣于月陨湖交换冰晶花戒。子嗣需行「月华授生」秘法。

霜月之庭由四殿组成：月祭司殿、守月卫殿、织月殿、月下庭。总部为月母神殿。

寒蝉雨出身月下庭，因双生武魂与神赐先天魂力被月母神殿视为异数。18岁这年，她决定离开霜月前往大陆历练。

═══════════════════════════
四、可选时间段（开场必选，共3个）
═══════════════════════════
开场时，你必须先列出以下时间段供玩家选择，等待玩家回复后再进入正片。

编号一，初出霜月。
说明：寒蝉雨刚离开霜月，独自踏上大陆，尚未收任何徒弟。寒蝉雨18岁。
建议起始地点：霜月出口，冰封山脉之外。
徒弟收徒进度：0位弟子，需逐一结识并收为徒。
徒弟年龄：16至17岁。

编号二，大赛时期。这是默认选项。
说明：全大陆高级魂师学院精英大赛，各方势力汇聚。寒蝉雨约19至20岁。
建议起始地点：天斗城，或大赛会场。
徒弟收徒进度：14位徒弟全部已收，但尚未正式确立伴侣关系。
武魂变异状态：已发生。外貌尚未完全定格，仍在变化中但减缓。
徒弟年龄：17至18岁。

     baseLevel:48, baseRings:"黄 黄 紫 紫",
     from:"原史莱克学院", title:"治疗系大姐姐",
     personality:"温柔体贴，安静内敛的表象下藏着一颗活泼的心。爱笑、爱闹、爱撒娇，擅长调和气氛。",
     appearance:"绛色长发，相貌柔美，身高一米六五左右，笑起来眼睛会弯成月牙。",
     note:"原著中戏份较少，在本世界线中得到更多成长空间。",
     fusion:"月华回春"}
  ];

  function parseTimeOffsetMonths() {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role !== "assistant") continue;
      const c = messages[i].content || "";
      const m = c.match(/【状态栏】[\s\S]*?时间[：:]\s*([^\n]+)/);
      if (!m) continue;
      const t = m[1];
      let total = 0;
      const yMatch = t.match(/(\d+)\s*年/);
      const mMatch = t.match(/(\d+)\s*(?:个月|月)/);
      if (yMatch) total += parseInt(yMatch[1], 10) * 12;
      if (mMatch) total += parseInt(mMatch[1], 10);
      if (total > 0) return total;
      return 0;
    }
    return 0;
  }

  function currentAgeOf(d) {
    const years = Math.floor(ageOffsetMonths / 12);
    const months = ageOffsetMonths % 12;
    return d.baseAge + years + (months / 12);
  }

  function isFrozen(d) {
    return currentAgeOf(d) >= d.appearanceAge;
  }

  function displayCurrentAge(d) {
    return Math.floor(currentAgeOf(d));
  }

  function currentHeight(d) {
    const cur = displayCurrentAge(d);
    const grown = Math.max(0, cur - d.baseAge);
    const gainAge = Math.min(grown, Math.max(0, 20 - d.baseAge));
    const freezeAge = d.appearanceAge;
    const effectiveGain = Math.min(gainAge, Math.max(0, freezeAge - d.baseAge));
    return Math.round(d.height + effectiveGain * 1.5);
  }

  function currentLevel(d) {
    const grown = Math.max(0, currentAgeOf(d) - d.baseAge);
    let level = d.baseLevel;
    let rem = grown;
    while (rem > 0) {
      if (level < 50) level += 4;
      else if (level < 65) level += 3;
      else if (level < 80) level += 2;
      else if (level < 90) level += 1.5;
      else if (level < 95) level += 1;
      else break;
      rem -= 1;
    }
    return Math.min(95, Math.round(level));
  }

  function loadCfg() {
    try { return JSON.parse(localStorage.getItem(LS_CFG) || "{}"); }
    catch { return {}; }
  }
  function saveCfg(cfg) {
    localStorage.setItem(LS_CFG, JSON.stringify(cfg));
  }
  function getStash() {
    return localStorage.getItem(LS_STASH) || "on";
  }
  function setStash(v) {
    localStorage.setItem(LS_STASH, v);
    updateStashBtn();
  }
  function updateStashBtn() {
    const b = $("btn-stash");
    if (!b) return;
    const on = getStash() === "on";
    b.textContent = "偷衣机制：" + (on ? "开" : "关");
    b.classList.toggle("primary", on);
  }

  function parseHaremFromChat() {
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role !== "assistant") continue;
      const c = messages[i].content || "";
      const m = c.match(/【后宫】([\s\S]*?)(?=\n【|$)/);
      if (m) return m[1];
    }
    return "";
  }

  function parseGoodness(name, haremText) {
    if (!haremText) return null;
    const re = new RegExp(name + "[^0-9\\-]{0,6}(-?\\d{1,3})");
    const m = haremText.match(re);
    if (m) {
      const v = parseInt(m[1], 10);
      if (!isNaN(v) && v >= -100 && v <= 100) return v;
    }
    return null;
  }

  function parseStatus(name, haremText) {
    if (!haremText) return "unknown";
    const lines = haremText.split(/\n/);
    for (const line of lines) {
      if (!line.includes(name)) continue;
      if (line.includes("💞") || line.includes("已确立")) return "established";
      if (line.includes("💗")) return "love";
      if (line.includes("〇")) return "none";
    }
    return "unknown";
  }

  function goodnessLabel(v) {
    if (v >= 81) return "深爱";
    if (v >= 51) return "爱慕";
    if (v >= 21) return "依赖";
    if (v >= 1) return "敬重";
    if (v === 0) return "陌生";
    if (v >= -20) return "委屈";
    if (v >= -49) return "冷战";
    return "伤心";
  }

  function renderRoster(tab) {
    tab = tab || "all";
    const haremText = parseHaremFromChat();
    rosterDetail.classList.remove("on");
    rosterGrid.style.display = "";

    let list = DISCIPLES.slice();
    if (tab === "harem") {
      list = list.filter(d => {
        const s = parseStatus(d.name, haremText);
        return s === "established" || s === "love" || s === "unknown";
      });
    } else if (tab === "unlocked") {
      list = list.filter(d => parseStatus(d.name, haremText) === "established");
    }

    rosterGrid.innerHTML = "";
    if (list.length === 0) {
      const tip = document.createElement("div");
      tip.className = "empty-tip";
      tip.style.gridColumn = "1/-1";
      tip.textContent = tab === "unlocked" ? "当前暂无已确立的伴侣。" : "暂无数据。";
      rosterGrid.appendChild(tip);
      return;
    }

    list.forEach(d => {
      const parsed = parseGoodness(d.name, haremText);
      const g = parsed !== null ? parsed : d.base;
      const status = parseStatus(d.name, haremText);
      const curAge = displayCurrentAge(d);
      const frozen = isFrozen(d);
      const level = currentLevel(d);
      const levelGain = level - d.baseLevel;

      const card = document.createElement("div");
      card.className = "dcard";

      const levelTagCls = levelGain > 0 ? "age-tag levelup" : "age-tag";
      const levelTagTxt = levelGain > 0 ? (level + " 级 +" + levelGain) : (level + " 级");

      card.innerHTML =

      card.onclick = () => showDetail(d);

        (frozen
          ? '她已完成霜月体质转化，容貌定格于 ' + d.appearanceAge + ' 岁，此后不再改变。实际年龄继续增长，但皮囊至死不变。'
          : '实际年龄达到 ' + d.appearanceAge + ' 岁时，容貌将彻底定格，此后不再改变。目前仍在成长期，容貌随年龄自然变化。') +
        (levelGain > 0
          ? ' 魂力较大赛时期基准提升了 ' + levelGain + ' 级，现阶段为 ' + level + ' 级。'

    $("roster-back").onclick = () => {

  function openSettings(firstTime) {

  function autoSave() {
    try {
      localStorage.setItem(LS_HIS, JSON.stringify(messages));
      localStorage.setItem(LS_AGE_OFF, String(ageOffsetMonths));
      const tip = document.getElementById("auto-save-tip");
      if (tip) {
        const t = new Date();
        tip.textContent = "已自动存档 " + 
          String(t.getHours()).padStart(2, "0") + ":" + 
          String(t.getMinutes()).padStart(2, "0") + ":" + 
          String(t.getSeconds()).padStart(2, "0");
      }

  function addMsg(role, content) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }
  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function extractOptions(bubble) {
    if (!bubble || !bubble.parentElement) return;
    const wrap = bubble.parentElement;
    const content = bubble.textContent || "";
    const marker = "【选项】";
    const idx = content.lastIndexOf(marker);
    if (idx === -1) return;

    const before = content.slice(0, idx).replace(/\s+$/, "");
    const after = content.slice(idx + marker.length);
    const opts = [];
    after.split(/\n/).forEach(line => {
      const m = line.trim().match(/^(\d+)\s*[、.．,，:：]\s*(.+)$/);
      if (m) opts.push({ num: m[1], text: m[2].trim() });
    });
    if (!opts.length) return;

    bubble.textContent = before;

    const bar = document.createElement("div");
    bar.className = "optbar";
    opts.forEach(o => {
      const b = document.createElement("button");
      b.className = "optbtn";
      b.type = "button";
      b.dataset.num = o.num;
      b.dataset.text = o.text;
      b.innerHTML = '<span class="num">' + o.num + '、</span>' + escapeHtml(o.text);
      b.onclick = () => {
        if (busy) return;
        if (/自由行动/.test(o.text)) {
          input.focus();
          input.scrollIntoView({behavior:"smooth", block:"center"});
          return;
        }
        send(o.num);
      };
      bar.appendChild(b);
    });
    wrap.appendChild(bar);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
  }

  function refreshOptionButtons() {
    const bars = chat.querySelectorAll(".optbar");
    bars.forEach((bar, i) => {
      const isLast = i === bars.length - 1;
      bar.querySelectorAll(".optbtn").forEach(b => {
        b.disabled = !isLast || busy;
      });
    });
  }

  $("btn-save").onclick = () => {
    localStorage.setItem(LS_HIS, JSON.stringify(messages));
    localStorage.setItem(LS_AGE_OFF, String(ageOffsetMonths));
    flash("已存档");
  };
  $("btn-load").onclick = () => {
    const raw = localStorage.getItem(LS_HIS);
    if (!raw) return flash("没有找到存档");
    try {
      messages = JSON.parse(raw);
      ageOffsetMonths = parseInt(localStorage.getItem(LS_AGE_OFF) || "0", 10) || 0;
      rebuildChat();
      flash("读档成功");
    } catch { flash("读档失败"); }
  };
  $("btn-export").onclick = () => {
    const text = messages.map(m =>
      (m.role === "user" ? "【我】\n" : "【GM】\n") + m.content
    ).join("\n\n" + "─".repeat(40) + "\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "寒蝉雨传-" + new Date().toISOString().slice(0,10) + ".txt";
    a.click();
  };
  $("btn-reset").onclick = () => {
    if (!confirm("确定要重新开始吗？当前对话将被清空（存档仍保留）。")) return;
    messages = [];
    chat.innerHTML = "";
    ageOffsetMonths = 0;
    localStorage.removeItem(LS_HIS);
    localStorage.removeItem(LS_AGE_OFF);
    startGame();
  };

  function flash(text) {
    const b = addMsg("sys", text);
    setTimeout(() => b.parentElement.remove(), 1800);
  }

  async function callAPI() {
    if (busy) return;
    const cfg = loadCfg();
    if (!cfg.url || !cfg.key || !cfg.model) {
      openSettings(true);
      return;
    }

    busy = true;
    btnSend.disabled = true;
    btnStop.style.display = "";
    refreshOptionButtons();

    const bubble = addMsg("ai", "");
    const typing = document.createElement("span");
    typing.className = "typing";
    typing.textContent = "正在生成";
    bubble.appendChild(typing);

    abortCtrl = new AbortController();
    let acc = "";

    const stashOn = getStash() === "on";
    const sysContent = SYSTEM_PROMPT + "\n\n【当前偷衣机制状态】" + 
      (stashOn 
        ? "开启。GM应正常按七之二执行，描写保持含蓄。" 
        : "关闭。GM严禁描写任何偷私人衣物的行为，包括但不限于偷袜子、鞋子、内衣内裤等。") +
      "\n\n【当前时间推进偏移】距今已过 " + ageOffsetMonths + " 个月。请确保状态栏【时间】一栏写明故事内日期，便于程序自动推算年龄与魂力。";

    try {
      const history = messages.slice(-cfg.history);
      const res = await fetch(cfg.url + "/chat/completions", {
        method: "POST",
        signal: abortCtrl.signal,
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.key
        },
        body: JSON.stringify({
          model: cfg.model,
          stream: true,
          messages: [
            { role: "system", content: sysContent },
            ...history
          ]
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error("HTTP " + res.status + "\n" + errText.slice(0, 500));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith("data:")) continue;
          const data = s.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content || "";
            if (delta) {
              acc += delta;
              if (typing.parentNode) typing.remove();
              bubble.textContent = acc;
              scrollBottom();
            }
          } catch (e) { }
        }
      }

      if (typing.parentNode) typing.remove();
      if (!acc) bubble.textContent = "（AI 没有返回内容）";

      if (acc) extractOptions(bubble);

      messages.push({ role: "assistant", content: acc });
      autoSave();

      const newOffset = parseTimeOffsetMonths();
      if (newOffset > ageOffsetMonths) {
        ageOffsetMonths = newOffset;
        localStorage.setItem(LS_AGE_OFF, String(ageOffsetMonths));
      }

      if (rosterDlg.open) {
        const active = document.querySelector("#roster-dlg .tab.active");
        renderRoster(active ? active.dataset.tab : "all");
      }

    } catch (e) {
      if (typing.parentNode) typing.remove();
      if (e.name === "AbortError") {
        bubble.textContent = acc + "\n\n（已停止）";
        if (acc) {
          extractOptions(bubble);
          messages.push({ role: "assistant", content: acc });
        }
        autoSave();
      } else {
        bubble.textContent = "⚠️ 请求失败：\n" + e.message +
          "\n\n请检查：\n1、API 地址是否正确（应以 /v1 或 /v4 结尾）\n2、Key 是否有效\n3、模型名是否存在\n4、网络是否能访问该服务";
      }
    } finally {
      busy = false;
      btnSend.disabled = false;
      btnStop.style.display = "none";
      abortCtrl = null;
      refreshOptionButtons();
      scrollBottom();
    }
  }

  async function send(text) {
    if (busy) return;
    text = (text || input.value).trim();
    if (!text) return;

    const cfg = loadCfg();
    if (!cfg.url || !cfg.key || !cfg.model) {
      openSettings(true);
      return;
    }

    const stashCmd = text.match(/[（(]\s*(开启|关闭)偷衣机制\s*[）)]/);
    if (stashCmd) {
      const on = stashCmd[1] === "开启";
      setStash(on ? "on" : "off");
      flash("偷衣机制已" + (on ? "开启" : "关闭"));
      input.value = "";
      input.style.height = "auto";
      return;
    }

    addMsg("user", text);
    messages.push({ role: "user", content: text });
    autoSave();
    input.value = "";
    input.style.height = "auto";

    await callAPI();
  }

  function rebuildChat() {
    chat.innerHTML = "";
    messages.forEach(m => {
      const bubble = addMsg(m.role === "assistant" ? "ai" : "user", m.content);
      if (m.role === "assistant") extractOptions(bubble);
    });
    refreshOptionButtons();
    autoSave();
  }

  function undoLast() {
    if (busy) return flash("正在生成中，请先停止");
    if (messages.length === 0) return flash("没有可撤回的内容");

    if (messages[messages.length - 1].role === "assistant") {
      messages.pop();
    }

    let userText = "";
    if (messages.length > 0 && messages[messages.length - 1].role === "user") {
      userText = messages.pop().content;
    }

    rebuildChat();

    if (userText) {
      input.value = userText;
      input.focus();
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
      flash("已撤回，可修改后重新发送");
    } else {
      flash("已撤回上一条回复");
    }
  }

  async function regenerate() {
    if (busy) return flash("正在生成中，请先停止");
    if (messages.length === 0) return flash("没有可重说的内容");

    if (messages[messages.length - 1].role === "assistant") {
      messages.pop();
    }

    if (messages.length === 0 || messages[messages.length - 1].role !== "user") {
      return flash("没有可重说的内容");
    }

    rebuildChat();
    await callAPI();
  }

  btnSend.onclick = () => send();
  btnStop.onclick = () => abortCtrl && abortCtrl.abort();
  $("btn-undo").onclick = () => undoLast();
  $("btn-regen").onclick = () => regenerate();

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });

  document.querySelectorAll(".quick button").forEach(b => {
    b.onclick = () => {
      const cmd = b.dataset.cmd;
      if (cmd === "（查看好感度）" || cmd === "（查看后宫）" || cmd === "（查看徒弟名录）") {
        $("btn-roster").click();
        if (cmd === "（查看后宫）") {
          const t = document.querySelector('#roster-dlg .tab[data-tab="harem"]');
          if (t) t.click();
        }
        return;
      }
      send(cmd);
    };
  });

  function startGame() {
    const cfg = loadCfg();
    if (!cfg.url || !cfg.key || !cfg.model) {
      addMsg("sys", "首次使用请先在右上角「⚙ 设置」中填写 API 信息");
      openSettings(true);
      return;
    }
    send("（开始游戏。请先列出可选时间段，等待我选择。）");
  }

  updateStashBtn();

  const cfg = loadCfg();
  if (!cfg.url || !cfg.key || !cfg.model) {
    addMsg("sys", "欢迎来到《斗罗大陆 · 寒蝉雨传》。请先在右上角「⚙ 设置」中填写 API 信息。");
    openSettings(true);
  } else {
    const raw = localStorage.getItem(LS_HIS);
    if (raw) {
      try {
        const arr = JSON.parse(raw);
        if (arr.length) {
          messages = arr;
          ageOffsetMonths = parseInt(localStorage.getItem(LS_AGE_OFF) || "0", 10) || 0;
          rebuildChat();
        }
      } catch (e) { }
    }
    if (messages.length === 0) startGame();
  }
})();
</script>
</body>
</html>
